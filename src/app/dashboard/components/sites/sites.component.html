<div class="row">
  <div class="col-12">
    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
      <h4 class="mb-sm-0">Gestion des Sites</h4>
      <div class="page-title-right">
        <ol class="breadcrumb m-0">
          <li class="breadcrumb-item">
            <a routerLink="/dashboard">Accueil</a>
          </li>
          <li class="breadcrumb-item active">Gestion des Sites</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col">
    <div class="card">
      <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">Liste des Sites</h5>
          <button class="btn btn-primary" (click)="openAddSiteModal()">
            Créer un Site
          </button>
        </div>
      </div>

      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-bordered">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Nom</th>
                <th scope="col">Tarif</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let site of sites">
                <td>{{ site.id }}</td>
                <td>{{ site.nom }}</td>
                <td>{{ site.tarif }} FCFA</td>
                <td>
                  <div class="d-flex gap-2">
                    <a class="dropdown-item" (click)="openDetailsModal(site)">
                      <i class="ri-edit-line fs-4 text-secondary"></i>
                    </a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
