<div class="type-synchro-container">
  <!-- Header Section -->
  <div class="page-header-section">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h2 class="page-title">Types de synchronisation</h2>
        <p class="page-subtitle">Gestion des types de synchronisation</p>
      </div>
    </div>
  </div>

  <!-- Main Card -->
  <div class="main-card animate-slide-up">
    <div class="card-header-modern">
      <div class="d-flex align-items-center gap-3">
        <div class="header-icon">
          <i class="ri-refresh-line"></i>
        </div>
        <div>
          <h5 class="card-title-modern mb-0">Liste des types</h5>
          <p class="card-subtitle-modern mb-0">{{ types?.length || 0 }} types configurés</p>
        </div>
      </div>
    </div>

    <div class="card-body-modern">
      <div class="table-modern">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Type</th>
              <th>Fréquence</th>
              <th>Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of types">
              <td>{{ item.type }}</td>
              <td>{{ item.time | cronTranslator }}</td>
              <td>
                <span class="badge badge-modern"
                      [ngClass]="{
                        'badge-success': item.status,
                        'badge-danger': !item.status
                      }">
                  {{ item.status ? "Activé" : "Désactivé" }}
                </span>
              </td>
              <td>
                <div class="d-flex gap-2 align-items-center">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch"
                      [checked]="item.status" (click)="toggleStatus(item, $event)" />
                  </div>
                  <button class="btn btn-icon-modern" (click)="openDetailsModal(item)">
                    <i class="ri-edit-line"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="!types || types.length === 0">
              <td colspan="4" class="text-center empty-row">
                <div class="empty-state-table">
                  <i class="ri-refresh-line"></i>
                  <p>Aucun type de synchronisation configuré</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
