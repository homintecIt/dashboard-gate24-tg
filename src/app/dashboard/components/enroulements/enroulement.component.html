<div class="enroulement-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-state">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
    <p class="mt-2">Chargement...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="alert-modern-error">
    <div class="d-flex align-items-center gap-3">
      <div class="alert-icon-error">
        <i class="ri-error-warning-line"></i>
      </div>
      <p class="mb-0">{{ error }}</p>
    </div>
  </div>

  <!-- Cards Grid -->
  <div class="cards-grid" *ngIf="!loading && !error">
    <!-- Nouveau Client Card -->
    <div class="action-card animate-fade-in" style="animation-delay: 0.1s;">
      <a routerLink="/dashboard/add-client">
        <div class="card-icon card-icon-red">
          <i class="ri-user-add-line"></i>
        </div>
        <h4 class="card-title">Nouveau Client</h4>
        <p class="card-text">Créer un nouveau compte client</p>
        <div class="card-arrow">
          <i class="ri-arrow-right-line"></i>
        </div>
      </a>
    </div>

    <!-- Nouveau Abonnement Card -->
    <div class="action-card animate-fade-in" style="animation-delay: 0.2s;">
      <a type="button" (click)="searchChoice()">
        <div class="card-icon card-icon-yellow">
          <i class="ri-price-tag-3-line"></i>
        </div>
        <h4 class="card-title">Nouveau Abonnement</h4>
        <p class="card-text">Ajouter un tag à un compte</p>
        <div class="card-arrow">
          <i class="ri-arrow-right-line"></i>
        </div>
      </a>
    </div>

    <!-- Consulter un Compte Card -->
    <div class="action-card animate-fade-in" style="animation-delay: 0.3s;">
      <a type="button" (click)="showCompte()">
        <div class="card-icon card-icon-purple">
          <i class="ri-bank-card-line"></i>
        </div>
        <h4 class="card-title">Consulter un Compte</h4>
        <p class="card-text">Voir les détails d'un compte</p>
        <div class="card-arrow">
          <i class="ri-arrow-right-line"></i>
        </div>
      </a>
    </div>

    <!-- Consulter un Abonnement Card -->
    <div class="action-card animate-fade-in" style="animation-delay: 0.4s;">
      <a type="button" (click)="showTag()">
        <div class="card-icon card-icon-blue">
          <i class="ri-id-card-line"></i>
        </div>
        <h4 class="card-title">Consulter un Abonnement</h4>
        <p class="card-text">Voir les détails d'un abonnement</p>
        <div class="card-arrow">
          <i class="ri-arrow-right-line"></i>
        </div>
      </a>
    </div>

    <!-- Recharge de Compte Card -->
    <div class="action-card animate-fade-in" style="animation-delay: 0.5s;">
      <a type="button" (click)="rechargeCompte()">
        <div class="card-icon card-icon-green">
          <i class="ri-wallet-3-line"></i>
        </div>
        <h4 class="card-title">Recharge de Compte</h4>
        <p class="card-text">Ajouter du crédit à un compte</p>
        <div class="card-arrow">
          <i class="ri-arrow-right-line"></i>
        </div>
      </a>
    </div>
  </div>
</div>
