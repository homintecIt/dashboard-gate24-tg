<div class="passages-daily-container">
  <!-- Header Section -->
  <div class="passages-header mb-4 animate-fade-in">
    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
      <div class="header-content">
        <h2 class="mb-1 fw-bold">Rapport par sites</h2>
        <p class="text-muted mb-0">Site: {{ site }}</p>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="loading-state animate-slide-up">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
    <p class="mt-3 text-muted">Chargement en cours...</p>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !records.length" class="empty-state animate-slide-up">
    <div class="empty-icon">
      <i class="ri-file-list-3-line"></i>
    </div>
    <h5 class="mt-3">Aucune donnée disponible</h5>
    <p class="text-muted">Il n'y a pas de données de passage pour le moment</p>
  </div>

  <!-- Data Table -->
  <div *ngIf="!loading && records.length" class="card passages-card animate-slide-up">
    <div class="card-header passages-card-header">
      <div class="d-flex align-items-center gap-3">
        <div class="passages-icon">
          <i class="ri-bar-chart-line"></i>
        </div>
        <div>
          <h5 class="mb-0 text-white">Rapport journalier</h5>
          <p class="mb-0 text-white-50">Site: {{ site }}</p>
        </div>
      </div>
    </div>

    <div class="card-body">
      <div class="table-modern">
        <table class="table table-hover">
          <thead>
            <tr>
              <th class="text-center">#</th>
              <th>Date</th>
              <th class="text-center">Passages</th>
              <th class="text-right">Total</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let record of records; let i = index">
              <td class="text-center">{{ i + 1 }}</td>
              <td><strong>{{ record.date }}</strong></td>
              <td class="text-center">
                <span class="badge badge-modern">{{ record.passages }}</span>
              </td>
              <td class="text-right amount-cell">{{ record.total }} F CFA</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
