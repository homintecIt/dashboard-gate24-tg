<div class="passage-by-subscriber-container">
  <!-- Header Section -->
  <div class="passages-header mb-4 animate-fade-in">
    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
      <div class="header-content">
        <h2 class="mb-1 fw-bold">Rapport par abonné</h2>
        <p class="text-muted mb-0">Historique des passages par abonné</p>
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <div *ngIf="data.length > 0; else noData" class="card passages-card animate-slide-up">
    <div class="card-header passages-card-header">
      <div class="d-flex align-items-center gap-3">
        <div class="passages-icon">
          <i class="ri-user-follow-line"></i>
        </div>
        <div>
          <h5 class="mb-0 text-white">Liste des passages</h5>
          <p class="mb-0 text-white-50">{{ data.length }} enregistrements</p>
        </div>
      </div>
    </div>

    <div class="card-body">
      <div class="table-modern">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Abonné</th>
              <th class="text-center">Nombre de passages</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of data">
              <td><strong>{{ item.subscriber }}</strong></td>
              <td class="text-center">
                <span class="badge badge-modern">{{ item.passages }}</span>
              </td>
              <td>{{ item.date }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <ng-template #noData>
    <div class="empty-state animate-slide-up">
      <div class="empty-icon">
        <i class="ri-file-list-3-line"></i>
      </div>
      <h5 class="mt-3">Aucune donnée disponible</h5>
      <p class="text-muted">{{ noDataMessage }}</p>
    </div>
  </ng-template>
</div>
