<div class="menus-container">
  <!-- Header Section -->
  <div class="page-header-section">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h2 class="page-title">Gestion des Menus</h2>
        <p class="page-subtitle">Configuration des menus de l'application</p>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-modern-back" (click)="goBack()">
          <i class="ri-arrow-left-line me-2"></i>Retour
        </button>
        <button class="btn btn-modern-primary" data-bs-toggle="modal" data-bs-target="#addMenuModal">
          <i class="ri-add-line me-2"></i>Ajouter
        </button>
      </div>
    </div>
  </div>

  <!-- Main Card -->
  <div class="main-card animate-slide-up">
    <div class="card-header-modern">
      <div class="d-flex align-items-center gap-3">
        <div class="header-icon">
          <i class="ri-menu-line"></i>
        </div>
        <div>
          <h5 class="card-title-modern mb-0">Liste des menus</h5>
          <p class="card-subtitle-modern mb-0">{{ menus.length || 0 }} menus configurés</p>
        </div>
      </div>
    </div>

    <div class="card-body-modern">
      <div class="table-modern">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>#</th>
              <th>Libellé</th>
              <th
              *ngIf=" authService.userRole ==='SuperAdmin'"
              >Actions</th>
            </tr>
          </thead>
          <tbody>
            <ng-container *ngIf="menus != null; then isDataExist; else isDataEmpty">
            </ng-container>
            <ng-template #isDataExist>
              <tr *ngFor="let menu of menus, let i = index">
                <td>{{ i + 1 }}</td>
                <td><strong>{{ formatActionName(menu.name!) }}</strong></td>
                <td *ngIf=" authService.userRole ==='SuperAdmin'">
                  <button *ngIf=" authService.userRole ==='SuperAdmin'"
                    type="button"
                    class="btn btn-icon-modern"
                    data-bs-toggle="modal"
                    data-bs-target="#updateMenuModal"
                    (click)="getMenu(menu)">
                    <i class="ri-edit-line"></i>
                  </button>
                </td>
              </tr>
            </ng-template>

            <ng-template #isDataEmpty>
              <tr>
                <td colspan="3" class="text-center empty-row">
                  <div class="empty-state-table">
                    <i class="ri-menu-line"></i>
                    <p>Aucun menu configuré</p>
                  </div>
                </td>
              </tr>
            </ng-template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

 <!-- Modal addMenuModal -->
<div class="modal fade" id="addMenuModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="addMenuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-modern">
      <form [formGroup]="menusForm" (ngSubmit)="addMenus()">
        <div class="modal-header">
          <h5 class="modal-title" id="addMenuModalLabel">Ajouter un menu</h5>
          <button type="button" id="closeAddModal" class="btn-close" data-bs-dismiss="modal" (click)="closeModal()"
            aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="name" class="form-label-modern">Libellé</label>
            <input type="text" class="form-control modern-input" id="name" placeholder="Entrez le libellé du menu" formControlName="name"
              [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
            <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
              <div *ngIf="f['name'].errors['required']">Le libellé est obligatoire</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-modern-secondary" (click)="closeModal()">Annuler</button>
          <button type="submit" class="btn btn-modern-primary">
            {{loading ? 'Veuillez patienter...' : 'Enregistrer'}}
            <span *ngIf="loading" class="spinner-border spinner-border-sm ms-2" role="status"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal updateMenuModal -->
<div class="modal fade" id="updateMenuModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="updateMenuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-modern">
      <form [formGroup]="menusForm" (ngSubmit)="updateMenu()">
        <div class="modal-header">
          <h5 class="modal-title" id="updateMenuModalLabel">Modifier le menu</h5>
          <button type="button" id="closeUpdateModal" class="btn-close" data-bs-dismiss="modal" (click)="closeUpdateModal()"
            aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="name" class="form-label-modern">Libellé</label>
            <input type="text" class="form-control modern-input" id="name" placeholder="Entrez le libellé du menu" formControlName="name"
              [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
            <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
              <div *ngIf="f['name'].errors['required']">Le libellé est obligatoire</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-modern-secondary" data-bs-dismiss="modal" (click)="closeModal()">Annuler</button>
          <button type="submit" class="btn btn-modern-primary">
            {{loading ? 'Veuillez patienter...' : 'Modifier'}}
            <span *ngIf="loading" class="spinner-border spinner-border-sm ms-2" role="status"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
