<!-- users.component.html -->
<div class="row">
  <div class="col-12">
    <div class="page-title-box d-sm-flex align-items-center justify-content-between">
      <h4 class="mb-sm-0">Liste des menus</h4>
      <div class="page-title-right">
        <ol class="breadcrumb m-0">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Accueil</a></li>
          <li class="breadcrumb-item active">menus</li>
        </ol>
      </div>
    </div>
  </div>
</div>
  <div class="col-12">
    <div class="p-2">

      <a href="javascript:avoid(0);" (click)="goBack()" class="btn btn-primary">
        <i class="ri-arrow-left-s-fill"></i>
        Retour</a>
      <br>
    </div>
  </div>
<div class="row">
  <div class="col">
    <div class="card">
      <div class="card-header bg-primary">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="card-title text-light mb-0">Liste des menus</h5>
          <div class="d-flex gap-3">

            <!-- <button type="button" class="btn btn-outline-light" data-bs-toggle="modal"
              data-bs-target="#addMenuModal">
              <i class="fas fa-sync-alt" [class.fa-spin]="loading"></i>
              Ajouter
            </button> -->



          </div>
        </div>
      </div>

      <div class="card-body">
        <!-- État de chargement -->

        <!-- Tableau des données -->
        <table class="table table-striped table-bordered">
        <thead class="table-blue">
          <tr>
            <th>#</th>
            <th>Libellé </th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngIf="menus != null; then isDataExist; else isDataEmpty">
          </ng-container>
          <ng-template #isDataExist>
            <tr *ngFor="let menu of menus, let i = index">
              <td> {{i+1}} </td>
              <td> {{  formatActionName(menu.name!)}} </td>

            </tr>
          </ng-template>

          <ng-template #isDataEmpty>
            <tr>
              <td colspan="4" class="text-center">Aucune donnée disponible</td>
            </tr>
          </ng-template>
        </tbody>
      </table>
      </div>
    </div>
  </div>
</div>

 <!-- Modal addSiteModal -->
<div class="modal fade" id="addMenuModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
  aria-labelledby="addMenuModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form [formGroup]="menusForm" (ngSubmit)="addMenus()">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="addMenuModalLabel">Enregistrement d’un menu</h1>
          <button type="button" id="closeAddModal" class="btn-close" data-bs-dismiss="modal" (click)="closeModal()"
            aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="mb-3">
              <label for="nom" class="form-label">Libellé</label>
              <input type="text" class="form-control" id="name" placeholder="" formControlName="name"
                [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
              <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
                <div *ngIf="f['name'].errors['required']">Le nom est
                  obligatoire</div>
              </div>
            </div>
      <!--       <div class="mb-3">
              <label for="tarif" class="form-label">Routes</label>
              <input type="text" class="form-control" id="path" placeholder="" formControlName="path"
                [ngClass]="{ 'is-invalid': submitted && f['path'].errors }">
              <div *ngIf="submitted && f['path'].errors" class="invalid-feedback">
                <div *ngIf="f['path'].errors['required']">Le path est
                  obligatoire</div>
                <div *ngIf="f['path'].errors['minlength']">
                  La taille minimale requise est 3 caractères
                </div>
              </div>
            </div> -->
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Annuler</button>
          <button type="submit" class="btn btn-blue">
            {{loading? 'Veuillez patienter ' : 'Enregister' }}
            <span class="{{ loading? 'spinner-border spinner-border-sm ms-2' : '' }}" role="status"> </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>


<!-- Modal updateSiteModal -->
